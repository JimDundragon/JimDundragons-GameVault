<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Vault 2.0</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#05070b;
 --panel:#10151f;
 --panel2:#171e2a;
 --panel3:#222c3c;
 --text:#f5f7fb;
 --muted:#8d99ab;
 --blue:#0070d1;
 --blue2:#00a9ff;
 --green:#35d07f;
 --red:#ff5268;
 --gold:#ffd45c;
 --pink:#ff73c9;
 --border:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
 margin:0;
 background:
 radial-gradient(circle at 15% 0%,rgba(0,112,209,.2),transparent 32%),
 radial-gradient(circle at 90% 5%,rgba(119,72,255,.16),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
 min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.login-box{
 width:min(430px,100%);
 background:rgba(16,21,31,.94);
 border:1px solid var(--border);
 border-radius:20px;
 padding:35px;
 box-shadow:0 30px 100px rgba(0,0,0,.55);
}
.logo{
 font-size:30px;
 font-weight:900;
 letter-spacing:1px;
 margin-bottom:8px;
}
.logo span{color:var(--blue2)}
.login-box p{color:var(--muted)}
.field{margin:14px 0}
.field label{
 display:block;
 color:#aeb8c7;
 font-size:12px;
 margin-bottom:6px;
}
.field input,.field select,.field textarea{
 width:100%;
 padding:12px;
 border-radius:9px;
 background:#171e29;
 color:white;
 border:1px solid var(--border);
 outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{
 border-color:var(--blue);
}
.btn{
 background:var(--panel2);
 color:white;
 border:1px solid var(--border);
 border-radius:9px;
 padding:10px 14px;
}
.btn:hover{background:var(--panel3)}
.btn.primary{
 background:linear-gradient(135deg,#006dcc,#00a4f4);
 border-color:transparent;
}
.btn.danger{color:#ff8c9d;background:#3a151e}
.top{
 height:70px;
 display:flex;
 align-items:center;
 gap:20px;
 padding:0 25px;
 position:sticky;
 top:0;
 z-index:50;
 background:rgba(5,7,11,.9);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--border);
}
.search{
 flex:1;
 max-width:650px;
}
.search input{
 width:100%;
 background:#141a24;
 color:white;
 border:1px solid var(--border);
 border-radius:30px;
 padding:12px 18px;
}
.account{
 margin-left:auto;
 display:flex;
 gap:8px;
 align-items:center;
}
.layout{
 display:grid;
 grid-template-columns:235px 1fr;
 min-height:calc(100vh - 70px);
}
.sidebar{
 padding:20px 14px;
 border-right:1px solid var(--border);
 background:rgba(8,11,17,.65);
}
.nav{
 width:100%;
 padding:11px 13px;
 border:0;
 border-radius:8px;
 background:transparent;
 color:#aeb8c7;
 text-align:left;
 margin:2px 0;
}
.nav:hover,.nav.active{
 background:#192230;
 color:white;
}
.nav span{float:right;color:var(--muted)}
.side-title{
 color:#687589;
 font-size:10px;
 letter-spacing:1.5px;
 margin:22px 12px 7px;
 text-transform:uppercase;
}
.main{padding:28px;min-width:0}
.hero{
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
 gap:20px;
 margin-bottom:25px;
}
.hero h1{font-size:34px;margin:0 0 7px}
.hero p{margin:0;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
 min-width:100px;
 padding:12px 15px;
 border:1px solid var(--border);
 border-radius:11px;
 background:rgba(255,255,255,.035);
}
.stat b{display:block;font-size:21px}
.stat small{color:var(--muted)}
.controls{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:22px;
}
.controls select{
 background:#151b26;
 color:white;
 border:1px solid var(--border);
 border-radius:8px;
 padding:9px;
}
.library{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
 gap:17px;
}
.card{
 background:linear-gradient(145deg,#151c28,#0c1017);
 border:1px solid var(--border);
 border-radius:12px;
 overflow:hidden;
 position:relative;
 transition:.2s;
}
.card:hover{
 transform:translateY(-5px);
 border-color:rgba(0,169,255,.45);
}
.cover,.placeholder{
 width:100%;
 aspect-ratio:2/3;
 object-fit:cover;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:20px;
}
.placeholder{
 background:linear-gradient(135deg,#1a2b42,#10151d);
 color:#718097;
 font-weight:bold;
}
.card-body{padding:11px}
.title{font-weight:bold;line-height:1.3}
.meta{font-size:11px;color:var(--muted);margin-top:6px}
.stars{color:var(--gold);margin-top:6px}
.badges{
 position:absolute;
 top:8px;
 left:8px;
 right:8px;
 display:flex;
 justify-content:space-between;
}
.badge{
 background:rgba(0,0,0,.78);
 border-radius:6px;
 padding:5px 7px;
 font-size:10px;
}
.badge.complete{color:#68eda1}
.badge.wish{color:#ff80d3}
.actions{display:flex;gap:5px;margin-top:9px}
.small{
 background:#222c3b;
 color:#dbe4f0;
 border:0;
 border-radius:6px;
 padding:5px 7px;
 font-size:11px;
}
.empty{
 padding:80px 20px;
 text-align:center;
 color:var(--muted);
}
.modal{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.78);
 backdrop-filter:blur(7px);
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.modal.show{display:flex}
.modal-box{
 width:min(850px,100%);
 max-height:92vh;
 overflow:auto;
 background:#111720;
 border:1px solid var(--border);
 border-radius:17px;
}
.modal-head{
 padding:19px 22px;
 display:flex;
 justify-content:space-between;
 border-bottom:1px solid var(--border);
}
.modal-head h2{margin:0}
.close{
 background:transparent;
 color:#8e9aaa;
 border:0;
 font-size:25px;
}
.form{
 padding:22px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px;
}
.full{grid-column:1/-1}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.check{
 background:#181f2b;
 padding:8px;
 border-radius:7px;
 font-size:12px;
}
.detail{
 padding:22px;
 display:grid;
 grid-template-columns:230px 1fr;
 gap:24px;
}
.detail img{width:100%;border-radius:10px}
.description{
 color:#b5bfce;
 line-height:1.6;
 white-space:pre-wrap;
}
.footer{
 padding:16px 22px;
 border-top:1px solid var(--border);
 display:flex;
 justify-content:flex-end;
 gap:8px;
}
.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#192331;
 padding:13px 16px;
 border-radius:9px;
 border:1px solid var(--border);
 opacity:0;
 transform:translateY(20px);
 transition:.2s;
 z-index:300;
}
.toast.show{opacity:1;transform:none}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 .sidebar{display:none}
 .main{padding:18px}
 .hero{flex-direction:column;align-items:flex-start}
}
@media(max-width:600px){
 .top{padding:0 12px}
 .top .logo{font-size:19px}
 .account .email{display:none}
 .library{grid-template-columns:repeat(2,1fr);gap:10px}
 .form,.detail{grid-template-columns:1fr}
 .full{grid-column:auto}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen" class="login">
 <div class="login-box">
  <div class="logo">GAME<span>VAULT</span></div>
  <p>Game Vault 2.0 — your library, everywhere.</p>

  <div class="field">
   <label>Email</label>
   <input id="email" type="email" placeholder="you@example.com">
  </div>

  <div class="field">
   <label>Password</label>
   <input id="password" type="password" placeholder="Password">
  </div>

  <button class="btn primary" style="width:100%" onclick="signIn()">
   Sign In
  </button>

  <button class="btn" style="width:100%;margin-top:8px" onclick="signUp()">
   Create Account
  </button>

  <p id="authMessage"></p>
 </div>
</section>

<!-- APP -->
<div id="app" class="hidden">

<header class="top">
 <div class="logo">GAME<span>VAULT</span></div>

 <div class="search">
  <input id="search" placeholder="Search your games..." oninput="render()">
 </div>

 <div class="account">
  <span class="email" id="userEmail"></span>
  <button class="btn" onclick="exportLibrary()">Export</button>
  <button class="btn primary" onclick="openEditor()">＋ Add</button>
  <button class="btn" onclick="signOut()">Sign Out</button>
 </div>
</header>

<div class="layout">

<aside class="sidebar">

 <button class="nav active" onclick="quick('all',this)">
  🎮 All Games <span id="nAll"></span>
 </button>

 <div class="side-title">Collection</div>

 <button class="nav" onclick="quick('physical',this)">
  💿 Physical <span id="nPhysical"></span>
 </button>

 <button class="nav" onclick="quick('digital',this)">
  ☁ Digital <span id="nDigital"></span>
 </button>

 <button class="nav" onclick="quick('wishlist',this)">
  ♡ Wishlist <span id="nWishlist"></span>
 </button>

 <div class="side-title">Progress</div>

 <button class="nav" onclick="quick('playing',this)">
  ▶ Playing
 </button>

 <button class="nav" onclick="quick('completed',this)">
  ✓ Completed
 </button>

 <button class="nav" onclick="quick('backlog',this)">
  ○ Backlog
 </button>

 <div class="side-title">Opinion</div>

 <button class="nav" onclick="quick('liked',this)">
  👍 Liked
 </button>

 <button class="nav" onclick="quick('disliked',this)">
  👎 Disliked
 </button>

</aside>

<main class="main">

 <section class="hero">
  <div>
   <h1 id="pageTitle">My Game Library</h1>
   <p id="subtitle">Cloud synchronized Game Vault</p>
  </div>

  <div class="stats">
   <div class="stat">
    <b id="total">0</b>
    <small>GAMES</small>
   </div>

   <div class="stat">
    <b id="owned">0</b>
    <small>OWNED</small>
   </div>

   <div class="stat">
    <b id="complete">0</b>
    <small>COMPLETED</small>
   </div>
  </div>
 </section>

 <div class="controls">

  <select id="platform" onchange="render()">
   <option value="">All Platforms</option>
   <option>PS5</option>
   <option>Xbox</option>
   <option>PC</option>
   <option>Switch</option>
  </select>

  <select id="genre" onchange="render()">
   <option value="">All Genres</option>
  </select>

  <select id="ownership" onchange="render()">
   <option value="">All Ownership</option>
   <option value="physical">Physical</option>
   <option value="digital">Digital</option>
   <option value="both">Both</option>
   <option value="none">Not Owned</option>
  </select>

  <select id="status" onchange="render()">
   <option value="">All Status</option>
   <option>Backlog</option>
   <option>Playing</option>
   <option>Completed</option>
   <option>Abandoned</option>
  </select>

  <select id="sort" onchange="render()">
   <option value="az">A–Z</option>
   <option value="za">Z–A</option>
   <option value="new">Newest</option>
   <option value="old">Oldest</option>
   <option value="rating">Highest Rated</option>
  </select>

 </div>

 <section id="library" class="library"></section>

</main>
</div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">
<div class="modal-box">

 <div class="modal-head">
  <h2 id="editHeading">Add Game</h2>
  <button class="close" onclick="closeModal('editModal')">×</button>
 </div>

 <form class="form" id="gameForm" onsubmit="saveGame(event)">

  <input id="gameId" type="hidden">

  <div class="field full">
   <label>Game Title</label>
   <input id="title" required>
  </div>

  <div class="field">
   <label>Platforms</label>

   <div class="checks">
    <label class="check">
     <input type="checkbox" name="platforms" value="PS5"> PS5
    </label>

    <label class="check">
     <input type="checkbox" name="platforms" value="Xbox"> Xbox
    </label>

    <label class="check">
     <input type="checkbox" name="platforms" value="PC"> PC
    </label>

    <label class="check">
     <input type="checkbox" name="platforms" value="Switch"> Switch
    </label>
   </div>
  </div>

  <div class="field">
   <label>Genres</label>
   <input id="genres" placeholder="RPG, Action, Horror">
  </div>

  <div class="field">
   <label>Release Year</label>
   <input id="year" type="number">
  </div>

  <div class="field">
   <label>Ownership</label>
   <select id="own">
    <option value="none">Not Owned</option>
    <option value="physical">Physical</option>
    <option value="digital">Digital</option>
    <option value="both">Physical + Digital</option>
   </select>
  </div>

  <div class="field">
   <label>Status</label>
   <select id="gameStatus">
    <option>Backlog</option>
    <option>Playing</option>
    <option>Completed</option>
    <option>Abandoned</option>
   </select>
  </div>

  <div class="field">
   <label>Your Rating</label>
   <select id="rating">
    <option value="0">Not Rated</option>
    <option value="1">★ 1</option>
    <option value="2">★ 2</option>
    <option value="3">★ 3</option>
    <option value="4">★ 4</option>
    <option value="5">★ 5</option>
   </select>
  </div>

  <div class="field">
   <label>Opinion</label>
   <select id="opinion">
    <option value="none">No Opinion</option>
    <option value="like">👍 Like</option>
    <option value="dislike">👎 Dislike</option>
   </select>
  </div>

  <div class="field">
   <label>Wishlist</label>
   <select id="wishlist">
    <option value="false">No</option>
    <option value="true">Yes</option>
   </select>
  </div>

  <div class="field">
   <label>Cover Image URL</label>
   <input id="cover">
  </div>

  <div class="field full">
   <label>Description</label>
   <textarea id="description" rows="5"></textarea>
  </div>

 </form>

 <div class="footer">
  <button class="btn" onclick="closeModal('editModal')">Cancel</button>
  <button class="btn primary" onclick="document.getElementById('gameForm').requestSubmit()">
   Save Game
  </button>
 </div>

</div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" class="modal">
<div class="modal-box">

 <div class="modal-head">
  <h2>Game Details</h2>
  <button class="close" onclick="closeModal('detailModal')">×</button>
 </div>

 <div id="details"></div>

</div>
</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://dicafrpkyjilbvelgjzi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5CiE1RDSNaVtf1R_JSnTZg_ZbqBKvFp";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let user = null;
let games = [];
let filter = "all";

/* =========================================================
   STARTUP
   ========================================================= */

async function start(){

 const {data:{session}} =
   await db.auth.getSession();

 if(session){
   user=session.user;
   showApp();
   await loadGames();
 }

 db.auth.onAuthStateChange(
   async(event,session)=>{

    if(session){
      user=session.user;
      showApp();
      await loadGames();
    }else{
      user=null;
      showLogin();
    }

   }
 );
}

function showLogin(){
 document.getElementById("loginScreen")
   .classList.remove("hidden");

 document.getElementById("app")
   .classList.add("hidden");
}

function showApp(){

 document.getElementById("loginScreen")
   .classList.add("hidden");

 document.getElementById("app")
   .classList.remove("hidden");

 document.getElementById("userEmail")
   .textContent=user.email||"";
}

/* =========================================================
   AUTH
   ========================================================= */

async function signUp(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){
   authMessage("Enter an email and password.");
   return;
 }

 const {error}=await db.auth.signUp({
   email,
   password
 });

 if(error){
   authMessage(error.message);
 }else{
   authMessage(
    "Account created. Check your email if confirmation is enabled."
   );
 }
}

async function signIn(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 const {error}=await db.auth.signInWithPassword({
   email,
   password
 });

 if(error) authMessage(error.message);
}

async function signOut(){
 await db.auth.signOut();
}

function authMessage(message){
 document.getElementById("authMessage")
   .textContent=message;
}

/* =========================================================
   DATABASE
   ========================================================= */

async function loadGames(){

 const {data,error}=await db
   .from("games")
   .select("*")
   .order("title");

 if(error){
   console.error(error);
   toast("Couldn't load your library.");
   return;
 }

 games=data||[];

 /*
  If this is a brand-new account, automatically load
  the starter collection.
 */
 if(games.length===0){
   await loadStarterCollection();
 }

 updateGenres();
 render();
}

async function saveToCloud(game){

 const payload={
   user_id:user.id,
   title:game.title,
   platforms:game.platforms,
   genres:game.genres,
   release_year:game.release_year,
   ownership:game.ownership,
   status:game.status,
   rating:game.rating,
   opinion:game.opinion,
   wishlist:game.wishlist,
   cover_url:game.cover_url,
   description:game.description,
   screenshots:game.screenshots,
   notes:game.notes
 };

 const {data,error}=await db
   .from("games")
   .upsert(payload)
   .select()
   .single();

 if(error){
   console.error(error);
   toast("Cloud save failed.");
   return null;
 }

 return data;
}

async function loadStarterCollection(){

 toast("Setting up your starter library...");

 const unique=[...new Set(starterGames.map(x=>x.toLowerCase()))];

 for(const lower of unique){

   const title=starterGames.find(
     x=>x.toLowerCase()===lower
   );

   const game=makeGame(title);

   const saved=await saveToCloud(game);

   if(saved) games.push(saved);
 }

 toast("Starter library loaded!");
}

function makeGame(title){

 return {
  title,
  platforms:guessPlatforms(title),
  genres:[guessGenre(title)],
  release_year:null,
  ownership:"none",
  status:"Backlog",
  rating:0,
  opinion:"none",
  wishlist:false,
  cover_url:null,
  description:null,
  screenshots:[],
  notes:null
 };
}

function guessPlatforms(title){

 const t=title.toLowerCase();

 if(t.includes("mario")||t.includes("pokemon"))
   return ["Switch"];

 return ["PS5"];
}

function guessGenre(title){

 const t=title.toLowerCase();

 if(/resident evil|dead space|until dawn|dark pictures|evil within|slender|phasmophobia/.test(t))
   return "Horror";

 if(/final fantasy|persona|nier|kingdom hearts|elden ring|dark souls|nioh|sekiro|code vein|tales of|star ocean|dragon age|baldur|witcher/.test(t))
   return "RPG";

 if(/call of duty|borderlands|helldivers|apex|fortnite|payday|battlefront/.test(t))
   return "Shooter";

 if(/madden|nba|mlb|nascar|rocket league|sonic|hot wheels/.test(t))
   return "Sports/Racing";

 return "Action/Adventure";
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

 const search=document.getElementById("search").value.toLowerCase();
 const platform=document.getElementById("platform").value;
 const genre=document.getElementById("genre").value;
 const ownership=document.getElementById("ownership").value;
 const status=document.getElementById("status").value;
 const sort=document.getElementById("sort").value;

 let list=games.filter(g=>{

  if(search && !g.title.toLowerCase().includes(search))
    return false;

  if(platform && !(g.platforms||[]).includes(platform))
    return false;

  if(genre && !(g.genres||[]).includes(genre))
    return false;

  if(ownership && g.ownership!==ownership)
    return false;

  if(status && g.status!==status)
    return false;

  if(filter==="physical" &&
     !["physical","both"].includes(g.ownership))
    return false;

  if(filter==="digital" &&
     !["digital","both"].includes(g.ownership))
    return false;

  if(filter==="wishlist"&&!g.wishlist)return false;
  if(filter==="playing"&&g.status!=="Playing")return false;
  if(filter==="completed"&&g.status!=="Completed")return false;
  if(filter==="backlog"&&g.status!=="Backlog")return false;
  if(filter==="liked"&&g.opinion!=="like")return false;
  if(filter==="disliked"&&g.opinion!=="dislike")return false;

  return true;
 });

 list.sort((a,b)=>{

  if(sort==="az")
    return a.title.localeCompare(b.title);

  if(sort==="za")
    return b.title.localeCompare(a.title);

  if(sort==="new")
    return (b.release_year||0)-(a.release_year||0);

  if(sort==="old")
    return (a.release_year||9999)-(b.release_year||9999);

  if(sort==="rating")
    return (b.rating||0)-(a.rating||0);

  return 0;
 });

 const library=document.getElementById("library");

 if(!list.length){
   library.innerHTML=`
   <div class="empty">
    <h2>No games found</h2>
    <p>Try changing your filters or add a game.</p>
   </div>`;
 }else{
   library.innerHTML=list.map(card).join("");
 }

 updateStats();
}

function card(g){

 const image=g.cover_url
  ? `<img class="cover"
      src="${esc(g.cover_url)}"
      onerror="this.outerHTML='<div class=placeholder>${esc(g.title)}</div>'">`
  : `<div class="placeholder">${esc(g.title)}</div>`;

 const stars=g.rating
  ? `<div class="stars">
      ${"★".repeat(g.rating)}${"☆".repeat(5-g.rating)}
     </div>`
  : "";

 return `
 <article class="card">

  ${image}

  <div class="badges">
   ${g.wishlist?
    `<span class="badge wish">♡ WISHLIST</span>`:""}

   ${g.status==="Completed"?
    `<span class="badge complete">✓ COMPLETE</span>`:""}
  </div>

  <div class="card-body">

   <div class="title">${esc(g.title)}</div>

   <div class="meta">
    ${g.release_year||""}
    ${g.genres?.length?" • "+esc(g.genres[0]):""}
   </div>

   ${stars}

   <div class="meta">
    ${(g.platforms||[]).join(" • ")}
   </div>

   <div class="actions">
    <button class="small"
      onclick="details('${g.id}')">View</button>

    <button class="small"
      onclick="editGame('${g.id}')">Edit</button>

    <button class="small"
      onclick="toggleLike('${g.id}')">
      ${g.opinion==="like"?"👍":"♡"}
    </button>
   </div>

  </div>
 </article>`;
}

/* =========================================================
   STATS
   ========================================================= */

function updateStats(){

 document.getElementById("total").textContent=games.length;

 document.getElementById("owned").textContent=
  games.filter(g=>g.ownership!=="none").length;

 document.getElementById("complete").textContent=
  games.filter(g=>g.status==="Completed").length;

 document.getElementById("nAll").textContent=games.length;

 document.getElementById("nPhysical").textContent=
  games.filter(g=>["physical","both"].includes(g.ownership)).length;

 document.getElementById("nDigital").textContent=
  games.filter(g=>["digital","both"].includes(g.ownership)).length;

 document.getElementById("nWishlist").textContent=
  games.filter(g=>g.wishlist).length;
}

function updateGenres(){

 const select=document.getElementById("genre");

 const genres=[
  ...new Set(
   games.flatMap(g=>g.genres||[])
  )
 ].sort();

 select.innerHTML=
  `<option value="">All Genres</option>`+
  genres.map(x=>`<option>${esc(x)}</option>`).join("");
}

function quick(type,button){

 filter=type;

 document.querySelectorAll(".nav")
  .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 const names={
  all:"My Game Library",
  physical:"Physical Collection",
  digital:"Digital Collection",
  wishlist:"Wishlist",
  playing:"Currently Playing",
  completed:"Completed Games",
  backlog:"Backlog",
  liked:"Liked Games",
  disliked:"Disliked Games"
 };

 document.getElementById("pageTitle")
  .textContent=names[type];

 render();
}

/* =========================================================
   EDIT
   ========================================================= */

function openEditor(game=null){

 document.getElementById("gameForm").reset();

 document.getElementById("gameId").value=
   game?.id||"";

 document.getElementById("editHeading").textContent=
   game?"Edit Game":"Add Game";

 if(game){

  document.getElementById("title").value=game.title;
  document.getElementById("genres").value=
    (game.genres||[]).join(", ");

  document.getElementById("year").value=
    game.release_year||"";

  document.getElementById("own").value=
    game.ownership;

  document.getElementById("gameStatus").value=
    game.status;

  document.getElementById("rating").value=
    game.rating||0;

  document.getElementById("opinion").value=
    game.opinion||"none";

  document.getElementById("wishlist").value=
    String(!!game.wishlist);

  document.getElementById("cover").value=
    game.cover_url||"";

  document.getElementById("description").value=
    game.description||"";

  document.querySelectorAll(
    'input[name="platforms"]'
  ).forEach(x=>{
    x.checked=(game.platforms||[]).includes(x.value);
  });

 }

 document.getElementById("editModal")
  .classList.add("show");
}

function editGame(id){

 const game=games.find(x=>x.id===id);

 if(game)openEditor(game);
}

async function saveGame(event){

 event.preventDefault();

 const id=document.getElementById("gameId").value;

 const platforms=[
  ...document.querySelectorAll(
   'input[name="platforms"]:checked'
  )
 ].map(x=>x.value);

 const game={
  title:document.getElementById("title").value.trim(),

  platforms:platforms.length
   ?platforms:["PS5"],

  genres:document.getElementById("genres").value
   .split(",")
   .map(x=>x.trim())
   .filter(Boolean),

  release_year:
   Number(document.getElementById("year").value)||null,

  ownership:
   document.getElementById("own").value,

  status:
   document.getElementById("gameStatus").value,

  rating:
   Number(document.getElementById("rating").value),

  opinion:
   document.getElementById("opinion").value,

  wishlist:
   document.getElementById("wishlist").value==="true",

  cover_url:
   document.getElementById("cover").value.trim()||null,

  description:
   document.getElementById("description").value.trim()||null,

  screenshots:[],
  notes:null
 };

 if(!game.title){
   toast("Enter a game title.");
   return;
 }

 if(id){

  game.id=id;

  const saved=await saveToCloud(game);

  if(saved){
   const index=games.findIndex(x=>x.id===id);
   games[index]=saved;
  }

 }else{

  const saved=await saveToCloud(game);

  if(saved)games.push(saved);
 }

 updateGenres();
 render();

 closeModal("editModal");

 toast("Game saved to the cloud.");
}

/* =========================================================
   DETAILS
   ========================================================= */

function details(id){

 const g=games.find(x=>x.id===id);

 if(!g)return;

 const image=g.cover_url
  ?`<img src="${esc(g.cover_url)}">`
  :`<div class="placeholder">${esc(g.title)}</div>`;

 document.getElementById("details").innerHTML=`

 <div class="detail">

  <div>${image}</div>

  <div>

   <h2>${esc(g.title)}</h2>

   <p class="meta">
    ${g.release_year||"Release year unknown"}
    ${g.genres?.length?" • "+esc(g.genres.join(", ")):""}
   </p>

   <p>
    <strong>Platforms:</strong>
    ${(g.platforms||[]).join(", ")}
   </p>

   <p>
    <strong>Ownership:</strong>
    ${g.ownership}
   </p>

   <p>
    <strong>Status:</strong>
    ${esc(g.status)}
   </p>

   <p>
    <strong>Opinion:</strong>
    ${g.opinion==="like"?"👍 Like":
      g.opinion==="dislike"?"👎 Dislike":"No opinion"}
   </p>

   <p>
    <strong>Rating:</strong>
    <span class="stars">
     ${g.rating
       ?"★".repeat(g.rating)+"☆".repeat(5-g.rating)
       :"Not rated"}
    </span>
   </p>

   <h3>Description</h3>

   <div class="description">
    ${esc(g.description||"No description yet.")}
   </div>

   <br>

   <button class="btn primary"
    onclick="closeModal('detailModal');editGame('${g.id}')">
    Edit
   </button>

   <button class="btn danger"
    onclick="deleteGame('${g.id}')">
    Delete
   </button>

  </div>

 </div>`;

 document.getElementById("detailModal")
  .classList.add("show");
}

/* =========================================================
   ACTIONS
   ========================================================= */

async function toggleLike(id){

 const game=games.find(x=>x.id===id);

 if(!game)return;

 game.opinion=
  game.opinion==="like"?"none":"like";

 await saveToCloud(game);

 render();
}

async function deleteGame(id){

 const game=games.find(x=>x.id===id);

 if(!game)return;

 if(!confirm(
  `Delete "${game.title}" from your library?`
 ))return;

 const {error}=await db
  .from("games")
  .delete()
  .eq("id",id)
  .eq("user_id",user.id);

 if(error){
  toast("Couldn't delete game.");
  return;
 }

 games=games.filter(x=>x.id!==id);

 closeModal("detailModal");

 render();

 toast("Game deleted.");
}

/* =========================================================
   EXPORT
   ========================================================= */

function exportLibrary(){

 const blob=new Blob(
  [JSON.stringify(games,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;
 a.download="game-vault-backup.json";
 a.click();

 URL.revokeObjectURL(url);
}

/* =========================================================
   MODALS
   ========================================================= */

function closeModal(id){
 document.getElementById(id)
  .classList.remove("show");
}

document.querySelectorAll(".modal").forEach(m=>{
 m.addEventListener("click",e=>{
  if(e.target===m)m.classList.remove("show");
 });
});

/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){

 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

let toastTimer;

function toast(message){

 const t=document.getElementById("toast");

 t.textContent=message;
 t.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
  t.classList.remove("show");
 },2500);
}

start();

</script>
